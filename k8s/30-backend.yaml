# ---------------------------------------------------------------------------
# MongoDB is deliberately NOT deployed into this cluster.
#
# The application requires a replica set (seven services use multi-document
# transactions). Running that well in Kubernetes means an operator, PVCs with
# the right storage class, backup and restore, and version upgrades — a
# substantial ongoing commitment, and doing it badly is worse than not doing it.
# The backend therefore points at a managed cluster via MONGODB_URI.
#
# For a local kind/minikube loop, add a single-replica StatefulSet with
# `--replSet rs0` and an init job; that is a development convenience, not this
# production topology.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: marketplace
  labels:
    app.kubernetes.io/name: marketplace
    app.kubernetes.io/component: backend
spec:
  # A starting point only — the HPA below owns this field once it is running.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a rollout: bring a new pod up
      # and let it pass its readiness probe before removing an old one.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace
        app.kubernetes.io/component: backend
    spec:
      # Satisfies the restricted Pod Security Standard set on the namespace.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user in node:22-alpine
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Give the process time to close in-flight requests. server.js already
      # handles SIGTERM by closing the HTTP server and disconnecting Mongo.
      terminationGracePeriodSeconds: 30
      # Spread replicas across nodes so a single node failure cannot take the
      # whole API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      containers:
        - name: backend
          image: ghcr.io/nameless770/amazon-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          # Config and credentials arrive as environment variables, which is
          # what the application already reads. Splitting them means a leaked
          # ConfigMap exposes nothing sensitive.
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # The root filesystem is read-only, so anything that needs to write
            # gets an explicit ephemeral mount.
            - name: tmp
              mountPath: /tmp
          resources:
            # `requests` is what the scheduler reserves and what the HPA
            # measures utilisation against — an HPA cannot work without it.
            requests:
              cpu: 100m
              memory: 256Mi
            # `limits` is the hard ceiling. Exceeding memory means an OOM kill;
            # exceeding CPU means throttling, not termination.
            limits:
              cpu: '1'
              memory: 512Mi

          # Three probes answering three different questions.

          # Startup: "has it finished booting?" Gives up to 60s for the first
          # MongoDB connection without forcing a lax liveness threshold. Until
          # this passes, the other two probes are suspended.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          # Liveness: "is the process wedged?" Deliberately hits the endpoint
          # that does NOT touch the database — a slow query or a brief database
          # outage must not get the container killed and restarted.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness: "should it receive traffic?" This one does check the
          # database, so a pod that cannot reach MongoDB is removed from the
          # Service endpoints while staying alive to recover.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: marketplace
  labels:
    app.kubernetes.io/name: marketplace
    app.kubernetes.io/component: backend
spec:
  # ClusterIP: reachable only inside the cluster. The Ingress is the sole way in
  # from outside, so the API has no public listener of its own.
  type: ClusterIP
  selector:
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
---
# ---------------------------------------------------------------------------
# IMPORTANT: horizontal scaling amplifies three in-process assumptions in this
# codebase. None of them corrupt data, but all three behave differently at N>1:
#
#   1. Rate limiting is an in-memory Map per process, so the effective limit is
#      roughly N x the configured value. Login lockout and AI throttling both
#      get proportionally weaker as this scales.
#   2. The natural-language search criteria cache is per process, so hit rate
#      falls as replicas increase.
#   3. The expired-reservation sweep runs on every replica. It is idempotent and
#      transactional, so it is safe — but it is N times the work, and at higher
#      replica counts it is worth moving to a CronJob with a single owner.
#
# Moving the first two to Redis is the prerequisite for scaling this past a
# couple of replicas with the guarantees intact.
# ---------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: marketplace
  labels:
    app.kubernetes.io/name: marketplace
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Percentages are of `requests`, not `limits`: 70% of 100m CPU.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React quickly to load, but not to a single noisy scrape.
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Come down slowly. Aggressive scale-down causes flapping, and each new
      # pod pays a fresh MongoDB connection cost.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# Keeps a voluntary disruption — a node drain during an upgrade — from taking
# every backend pod at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
