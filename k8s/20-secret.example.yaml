# TEMPLATE ONLY — every value here is a placeholder. Do not put real
# credentials in this file, and do not commit a filled-in copy.
#
# A Kubernetes Secret is base64-encoded, NOT encrypted. Anyone who can read
# secrets in this namespace, and anyone who can read etcd, can read these
# values. Base64 is an encoding for binary safety, not a protection.
#
# ---------------------------------------------------------------------------
# Preferred: never create this object from a file at all. Create it imperatively
# so the values exist only in your shell history and in etcd:
#
#   kubectl -n marketplace create secret generic backend-secrets \
#     --from-literal=MONGODB_URI='mongodb+srv://USER:PASS@cluster.mongodb.net/marketplace?retryWrites=true&w=majority' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=STRIPE_SECRET_KEY='sk_live_...' \
#     --from-literal=STRIPE_WEBHOOK_SECRET='whsec_...' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'
#
# For GitOps, where the manifest must live in the repository, use an encrypted
# form instead of this file: Sealed Secrets (encrypted to the cluster's public
# key, safe to commit) or External Secrets Operator (values stay in AWS Secrets
# Manager / Vault and are synced in). Both keep plaintext out of git.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: marketplace
  labels:
    app.kubernetes.io/name: marketplace
    app.kubernetes.io/component: backend
type: Opaque
# stringData takes plain text and Kubernetes encodes it on write, so a template
# stays readable. It is write-only: reading the Secret back returns `data`.
stringData:
  # MongoDB is intentionally NOT run inside this cluster — see the note at the
  # top of 30-backend.yaml. This points at a managed replica set.
  # Angle-bracket placeholders rather than a realistic-looking URI: a template
  # shaped like a credential trips secret scanners and trains people to ignore
  # the alerts.
  MONGODB_URI: 'mongodb+srv://<username>:<password>@<cluster>.mongodb.net/marketplace'

  # Must be at least 32 characters of real entropy: the API validates strength
  # at startup and refuses to boot in production with a weak or placeholder
  # value. Generate with: openssl rand -base64 48
  JWT_SECRET: 'REPLACE_ME_generate_with_openssl_rand_base64_48'

  # Optional. Unset, checkout still records orders and reports that payments are
  # not configured rather than failing.
  STRIPE_SECRET_KEY: ''
  STRIPE_WEBHOOK_SECRET: ''

  # Optional. Unset, AI features degrade to their non-AI behaviour.
  ANTHROPIC_API_KEY: ''
