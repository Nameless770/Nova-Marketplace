name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant. Tags are
# never cancelled — those produce released artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; the only job that needs more asks for it locally.
permissions:
  contents: read

env:
  # Matches the Dockerfiles, so CI exercises the runtime that actually ships
  # rather than whatever the runner defaults to.
  NODE_VERSION: '22'
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Three workspaces, three lockfiles — all must key the cache or it
          # goes stale whenever only one of them changes.
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      # ESLint at the root covers both workspaces, but it needs each workspace's
      # dependencies present to resolve their imports.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - run: npm run lint
      - run: npm run format:check

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix server

      # The suite spins up a real MongoDB replica set in memory (seven services
      # use multi-document transactions, which standalone mongod cannot serve).
      # That means downloading a ~100 MB mongod binary; without this cache every
      # run pays for it again.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Run tests
        working-directory: server
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
          # Left unset deliberately: NODE_ENV=production would make the JWT
          # strength guard fatal and the suite's fixed test secret would fail.
          CI: true
        run: npm test

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Test
        run: npm test --prefix client

  # A live database credential was committed to this repository once. Rotation is
  # what neutralised it, but the cheaper fix is not needing to rotate again —
  # this fails the build on a secret before it can be merged.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and then "removed" in a later commit is
          # still in the pack, and is exactly the case that got missed before.
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Dependency and container scanning. Publishing an image without knowing what
  # it carries is how a known CVE reaches a registry unnoticed.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `--omit=dev` because a vulnerability in a build-time-only package is not
      # the same risk as one in what actually ships and runs.
      - name: Audit production dependencies
        run: |
          set -o pipefail
          for workspace in . client server; do
            echo "::group::npm audit ($workspace)"
            npm audit --omit=dev --audit-level=high --prefix "$workspace"
            echo "::endgroup::"
          done

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Build
        env:
          # Relative, matching the container setup where nginx proxies /api.
          VITE_API_URL: /api/v1
        run: npm run build --prefix client

      - name: Report bundle size
        run: |
          echo "### Frontend bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh client/dist >> "$GITHUB_STEP_SUMMARY"
          ls -lh client/dist/assets >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist
          retention-days: 7

  build-backend:
    name: Verify backend production install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # There is no transpile step for the backend — it is plain ESM. What can
      # break is the production install: `npm ci --omit=dev` must resolve and
      # bcrypt must compile. The test job never exercises that path because it
      # installs dev dependencies.
      - name: Production install
        working-directory: server
        run: npm ci --omit=dev

      - name: Smoke check that the app boots without dev dependencies
        working-directory: server
        env:
          JWT_SECRET: ci-smoke-check-secret-not-used-for-signing-anything
        run: node --input-type=module -e "await import('./app.js'); console.log('app module loaded')"

  # Proves the deployment path rather than asserting it. Building an image says
  # nothing about whether the composed stack actually serves traffic — this
  # brings the whole thing up and asks it.
  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Job-level, not step-level: `docker compose` interpolates the compose file
    # on *every* invocation, so `logs` and `down` need JWT_SECRET just as much as
    # `up` does. Scoping it to the start step would leave teardown failing.
    #
    # The compose file declares JWT_SECRET as `${JWT_SECRET:?...}` — required,
    # no default — so without this the stack never starts. It must also survive
    # the app's production strength check: at least 32 characters, 12 distinct,
    # and not beginning with a placeholder word like "test" or "secret".
    env:
      JWT_SECRET: ci-smoke-2f9Kq7xLm4Rw8vTz-not-used-for-signing-anything
      PUBLIC_PORT: '8080'
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240

      # Through nginx on 8080, NOT the API's own 5000: compose deliberately gives
      # the backend `expose` rather than `ports`, so it is unreachable from the
      # runner. Going through the proxy is also the more honest test — it is the
      # path a real client takes.
      #
      # Readiness, not liveness: this is the probe that reports whether the API
      # can actually reach its database, which is what "deployed" has to mean.
      - name: Wait for the API to report ready
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health/ready | grep -q '"status":"ready"'; then
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 4
          done
          echo "API never became ready"
          exit 1

      - name: Serve a real request through the stack
        run: |
          curl -fsS "http://localhost:8080/api/v1/categories" -o /dev/null
          echo "categories endpoint served through nginx"

      - name: Confirm the frontend is served
        run: |
          curl -fsS "http://localhost:8080/" -o /dev/null
          echo "frontend served"

      # The logs are the only way to diagnose a failure here after the fact.
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # Validates the Kubernetes manifests parse and cross-reference correctly.
  # Cheap, and it catches the class of typo that otherwise fails at apply time.
  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/

      # `-strict` rejects unknown fields, which is what catches a misspelled key
      # that Kubernetes would otherwise silently ignore.
      - name: Validate
        run: kubeconform -strict -summary -ignore-filename-pattern '.*\.example\.yaml' k8s/

  images:
    name: Build and push images
    runs-on: ubuntu-latest
    # Gated on every check: an image is never published from a commit that
    # failed lint, tests, either build, the audit, or the smoke test.
    needs: [lint, test, test-frontend, audit, build-frontend, build-backend, smoke, manifests]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./server
          - name: frontend
            context: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is reached through the secrets context, is scoped to this
      # single run, and rotates automatically — preferable to storing long-lived
      # registry credentials. To use Docker Hub instead, swap this step for:
      #   registry: docker.io
      #   username: ${{ secrets.DOCKERHUB_USERNAME }}
      #   password: ${{ secrets.DOCKERHUB_TOKEN }}
      # and change REGISTRY / IMAGE_NAME accordingly.
      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase path; the owner segment may not be.
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Built locally first so it can be scanned before anything is published.
      # The push below reuses this layer cache, so the second build is near-free.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: scan-target:${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VITE_API_URL=/api/v1

      # Fails the job on a HIGH or CRITICAL vulnerability that has a fix
      # available. Unfixed findings are reported but do not block, since there is
      # no action to take on them yet.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:${{ matrix.name }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Pull requests build the image to prove the Dockerfile still works,
          # but publish nothing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache shared across runs; scoped per image so the two builds
          # do not evict each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VITE_API_URL=/api/v1

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
