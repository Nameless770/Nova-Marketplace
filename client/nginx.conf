# Serves the built SPA and proxies the API, so the browser only ever talks to
# one origin. That keeps the image free of any environment-specific API host and
# removes CORS from the browser's path entirely.

upstream api {
    # Resolved on the Docker network; matches the compose service name.
    server backend:5000;
}

server {
    # A port above 1024, so this can be swapped to a rootless nginx image
    # without needing NET_BIND_SERVICE.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never trust an upstream to declare the content type of a script.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health check target — answered by nginx itself, so it reports on
    # nginx rather than on the API behind it.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend rate-limits per IP, so it needs the real client address
        # rather than the proxy's.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI endpoints can be slow
        proxy_connect_timeout 5s;
    }

    # Hashed filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on stale
    # markup pointing at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
